<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmácias Connect · Equipa</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f7f6f3; --white: #fff; --ink: #1a1a1a; --ink2: #444; --ink3: #888; --ink4: #bbb;
  --line: #e8e6e1; --green: #1a7a4a; --green-lt: #e8f5ee; --green-mid: #2ea865;
  --amber: #b45309; --amber-lt: #fef3c7; --red: #b91c1c; --red-lt: #fee2e2;
  --blue: #1d4ed8; --blue-lt: #eff6ff; --r: 10px;
}
body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; font-size:14px; }

/* HEADER */
.header {
  background:var(--white); border-bottom:1px solid var(--line);
  padding:0 32px; height:56px; display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:0; z-index:100;
}
.brand { font-size:15px; font-weight:700; letter-spacing:-0.3px; }
.brand span { color:var(--green); }
.header-center { display:flex; align-items:center; gap:8px; }
.header-right { display:flex; align-items:center; gap:12px; }
.divider-v { width:1px; height:20px; background:var(--line); margin:0 8px; }
.period-badge { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink3); }

/* FARMÁCIA SELECTOR */
.farm-selector { display:flex; gap:2px; background:var(--bg); border-radius:8px; padding:3px; }
.farm-btn {
  padding:5px 14px; border-radius:6px; border:none; background:transparent;
  font-family:'Inter',sans-serif; font-size:12px; font-weight:500; color:var(--ink3); cursor:pointer; transition:all 0.15s;
}
.farm-btn.active { background:var(--white); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }

/* MODE SWITCHER */
.mode-switcher { display:flex; gap:2px; background:var(--bg); border-radius:8px; padding:3px; }
.mode-btn {
  padding:5px 14px; border-radius:6px; border:none; background:transparent;
  font-family:'Inter',sans-serif; font-size:12px; font-weight:500; color:var(--ink3); cursor:pointer; transition:all 0.15s;
}
.mode-btn.active { background:var(--white); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.08); }

/* LOADING */
.loading {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:60vh; gap:16px; color:var(--ink3);
}
.spinner {
  width:32px; height:32px; border:3px solid var(--line); border-top-color:var(--green);
  border-radius:50%; animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

/* LAYOUT */
.page { padding:28px 32px; max-width:1280px; margin:0 auto; }
.note { font-size:11px; color:var(--ink4); font-family:'JetBrains Mono',monospace; margin-bottom:20px; }
.sec-label { font-size:10px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink3); margin-bottom:14px; }

/* FATOR */
.fator-block {
  background:var(--white); border:1px solid var(--line); border-radius:var(--r);
  padding:24px 28px; display:flex; align-items:center; gap:32px; margin-bottom:24px;
}
.fator-num { font-size:56px; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--green); line-height:1; }
.fator-info { flex:1; }
.fator-title { font-size:13px; font-weight:600; margin-bottom:4px; }
.fator-sub { font-size:12px; color:var(--ink3); line-height:1.6; }
.fator-next { background:var(--green-lt); border:1px solid #a7f3d0; border-radius:8px; padding:12px 20px; text-align:center; }
.fator-next-label { font-size:10px; color:var(--green); font-weight:600; letter-spacing:1px; text-transform:uppercase; margin-bottom:4px; }
.fator-next-val { font-size:18px; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--green); }

/* KPI GRID */
.kpi-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
.kpi-card { background:var(--white); border:1px solid var(--line); border-radius:var(--r); padding:18px 20px; }
.kpi-label { font-size:10px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink3); margin-bottom:10px; }
.kpi-val { font-size:22px; font-weight:700; font-family:'JetBrains Mono',monospace; line-height:1; margin-bottom:6px; }
.kpi-obj { font-size:11px; color:var(--ink3); margin-bottom:8px; }
.progress-track { height:4px; background:var(--line); border-radius:99px; overflow:hidden; }
.progress-fill { height:100%; border-radius:99px; transition:width 0.8s cubic-bezier(.4,0,.2,1); }
.kpi-pct-row { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
.kpi-pct { font-size:12px; font-weight:600; font-family:'JetBrains Mono',monospace; }
.pct-green { color:var(--green); } .pct-amber { color:var(--amber); } .pct-red { color:var(--red); }

/* STATS ROW */
.stats-row { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:24px; }
.stat-box { background:var(--white); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; }
.stat-label { font-size:10px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink3); margin-bottom:6px; }
.stat-val { font-size:24px; font-weight:700; font-family:'JetBrains Mono',monospace; line-height:1; }
.stat-trend { font-size:11px; margin-top:4px; font-family:'JetBrains Mono',monospace; color:var(--ink3); }
.trend-up { color:var(--green); } .trend-dn { color:var(--red); }

/* BAR CHART */
.bar-chart { display:flex; align-items:flex-end; gap:6px; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; }
.bar-fill { width:100%; border-radius:4px 4px 0 0; min-height:4px; }
.bar-month { font-size:9px; color:var(--ink4); font-family:'JetBrains Mono',monospace; }
.bar-val { font-size:9px; color:var(--ink3); }

/* COLAB */
.colab-row { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
.colab-btn {
  display:flex; align-items:center; gap:8px; padding:8px 16px; border-radius:99px;
  border:1.5px solid var(--line); background:var(--white); font-family:'Inter',sans-serif;
  font-size:13px; font-weight:500; color:var(--ink2); cursor:pointer; transition:all 0.15s;
}
.colab-btn:hover { border-color:var(--ink3); }
.colab-btn.active { background:var(--ink); border-color:var(--ink); color:var(--white); }
.colab-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }

/* COLAB GRID */
.colab-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px; }
.colab-card { background:var(--white); border:1px solid var(--line); border-radius:var(--r); padding:20px; }
.colab-card-title { font-size:11px; font-weight:600; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink3); margin-bottom:16px; }

/* OBJ */
.obj-rows { display:flex; flex-direction:column; gap:14px; }
.obj-row-item { display:flex; flex-direction:column; gap:6px; }
.obj-header { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.obj-name { font-size:12px; font-weight:500; line-height:1.4; }
.obj-badge { font-size:10px; font-weight:600; padding:2px 8px; border-radius:4px; white-space:nowrap; font-family:'JetBrains Mono',monospace; }
.badge-green { background:var(--green-lt); color:var(--green); }
.badge-amber { background:var(--amber-lt); color:var(--amber); }
.badge-red { background:var(--red-lt); color:var(--red); }
.obj-sub { font-size:11px; color:var(--ink3); }

/* VS GRID */
.vs-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.vs-card { background:var(--bg); border-radius:8px; padding:12px 14px; }
.vs-label { font-size:10px; color:var(--ink3); font-weight:500; margin-bottom:8px; text-transform:uppercase; letter-spacing:0.8px; }
.vs-bars { display:flex; gap:6px; align-items:flex-end; height:48px; }
.vs-b { flex:1; border-radius:3px 3px 0 0; }
.vs-legend { display:flex; gap:8px; margin-top:6px; }
.vs-leg-item { display:flex; align-items:center; gap:4px; font-size:9px; color:var(--ink3); }
.vs-leg-dot { width:6px; height:6px; border-radius:1px; }

/* EMPTY STATE */
.empty { text-align:center; padding:40px; color:var(--ink3); font-size:13px; }
.view { display:none; }
.view.active { display:block; }
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="brand">Farmácias <span>Connect</span></div>
    <div class="divider-v"></div>
    <div class="farm-selector" id="farm-selector">
      <button class="farm-btn active" onclick="setFarmacia('aroeira',this)">Aroeira</button>
      <button class="farm-btn" onclick="setFarmacia('diasbrito',this)">Dias e Brito</button>

    </div>
  </div>

</div>

<div id="mes-selector" style="display:none;background:var(--white);border-bottom:1px solid var(--line);padding:8px 24px;gap:6px;flex-wrap:wrap">
  <button class="farm-btn" onclick="setMesFim(1,this)">Jan</button>
  <button class="farm-btn" onclick="setMesFim(2,this)">Fev</button>
  <button class="farm-btn" onclick="setMesFim(3,this)">Mar</button>
  <button class="farm-btn" onclick="setMesFim(4,this)">Abr</button>
  <button class="farm-btn" onclick="setMesFim(5,this)">Mai</button>
  <button class="farm-btn" onclick="setMesFim(6,this)">Jun</button>
  <button class="farm-btn" onclick="setMesFim(7,this)">Jul</button>
  <button class="farm-btn" onclick="setMesFim(8,this)">Ago</button>
  <button class="farm-btn" onclick="setMesFim(9,this)">Set</button>
  <button class="farm-btn" onclick="setMesFim(10,this)">Out</button>
  <button class="farm-btn" onclick="setMesFim(11,this)">Nov</button>
  <button class="farm-btn" onclick="setMesFim(12,this)">Dez</button>
</div>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div>A carregar dados...</div>
</div>

<div id="app" style="display:none">
  <div class="page">
    <div id="data-note" class="note"></div>

    <!-- VISTA EQUIPA -->
    <div id="view-equipa" class="view active">

      <div class="sec-label">Prémio 2026</div>
      <div class="fator-block">
        <div class="fator-num" id="fator-num">—</div>
        <div class="fator-info">
          <div class="fator-title">Fator atual estimado</div>
          <div class="fator-sub" id="fator-sub"></div>
        </div>
        <div class="fator-next" id="fator-next" style="display:none">
          <div class="fator-next-label">Para fator seguinte</div>
          <div class="fator-next-val" id="fator-next-val"></div>
          <div style="font-size:11px;color:var(--green);margin-top:2px">de margem em H2</div>
        </div>
      </div>

      <div class="sec-label">Objetivos Farmácia · Acumulado YTD</div>
      <div class="kpi-grid" id="kpi-grid"></div>

      <div class="sec-label">Equipa · Resumo YTD</div>
      <div class="stats-row" id="equipa-stats"></div>

      <div id="equipa-chart-wrap" style="background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:24px">
        <div class="colab-card-title">Vendas Mensais Equipa (€k sem IVA)</div>
        <div id="equipa-chart" class="bar-chart" style="height:120px"></div>
      </div>

    </div>

    <!-- VISTA INDIVIDUAL -->
    <div id="view-individual" class="view">
      <div class="sec-label">Selecionar colaborador/a</div>
      <div class="colab-row" id="colab-row"></div>
      <div id="colab-name-header" style="font-size:20px;font-weight:700;margin-bottom:16px;letter-spacing:-0.3px"></div>
      <div class="stats-row" id="colab-stats"></div>
      <div class="colab-grid" id="colab-grid-top"></div>
      <div class="colab-grid" id="colab-grid-bot"></div>
    </div>

  </div>
</div>

<script>
// ── CONSTANTES ───────────────────────────────────────────────────────────────
const DATA_URL = 'https://raw.githubusercontent.com/dannihell/farmacia-tools/main/data/rh_farmacias.json';

const MESES_LABELS = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const COLAB_COLORS = ['#1d4ed8','#7c3aed','#b45309','#0f766e','#be123c','#0369a1','#065f46'];

// KPIs globais por farmácia (objetivos anuais 2026)
const OBJETIVOS = {
  aroeira:      { margem: 597000, otc: 236000, saude: 584000, rent_gen: 4.45 },
  diasbrito:    { margem: 400000, otc: 150000, saude: 380000, rent_gen: 4.45 },
  universitaria:{ margem: 300000, otc: 110000, saude: 280000, rent_gen: 4.45 },
};

// Objetivos individuais por colaborador (nome em minúsculas sem acentos)
// Configura conforme necessário — ficam como placeholder se não definidos
const OBJ_INDIVIDUAL = {
  aroeira: {
    duarte:  [{ label:'Suplementos crescer ≥ 1%', pct: null, status:'amber', sub:'calculado automaticamente' }],
    matilde: [{ label:'Devoluções por erro — baseline Q3', pct: null, status:'amber', sub:'Período de medição' }],
    alina:   [{ label:'Dermofarmácia crescer ≥ 1%', pct: null, status:'amber', sub:'calculado automaticamente' }],
    jessica: [{ label:'Resp. Genéricos · rent. ≥ 4,45€/emb', pct: null, status:'amber', sub:'calculado automaticamente' }],
    tatiana: [{ label:'Organização de loja · sem incidências', pct: 90, status:'green', sub:'Avaliação trimestral Q2' }],
  }
};

// ── ESTADO ───────────────────────────────────────────────────────────────────
let dados       = null;
let farmAtual   = 'aroeira';
let modoAtual   = 'equipa';
let colabAtual  = null;
let mesFimAtual = new Date().getMonth() + 1; // mês actual por defeito

// ── UTILS ────────────────────────────────────────────────────────────────────
const fmt  = (n, dec=0) => (n||0).toLocaleString('pt-PT',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const fmtE = (n, dec=0) => '€' + fmt(n, dec);
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'_');

function calcFator(margem) {
  if (!margem) return { fator:'—', cresc: null };
  // Estima crescimento YTD anualizado
  const hoje = new Date();
  const diasAno = 365;
  const diasDecorridos = Math.floor((hoje - new Date(hoje.getFullYear(),0,1)) / 86400000) + 1;
  const margemAnual = (margem / diasDecorridos) * diasAno;
  const ref = 573000; // margem 2025 Aroeira (ajustar por farmácia)
  const crescPct = ((margemAnual - ref) / ref) * 100;
  let fator = '0,7';
  if (crescPct >= 6) fator = '1,2';
  else if (crescPct >= 5) fator = '1,1';
  else if (crescPct >= 4) fator = '1,0';
  else if (crescPct >= 3) fator = '0,9';
  else if (crescPct >= 2) fator = '0,8';
  return { fator, crescPct: Math.round(crescPct * 10) / 10, margemAnual };
}

function pctColor(pct, esperado=50) {
  if (pct >= esperado) return 'var(--green)';
  if (pct >= esperado * 0.85) return 'var(--amber)';
  return 'var(--red)';
}
function pctClass(pct, esp=50) {
  return pct >= esp ? 'pct-green' : pct >= esp * 0.85 ? 'pct-amber' : 'pct-red';
}

// ── DADOS FICTÍCIOS ───────────────────────────────────────────────────────────
function gerarColabMock(nome, vendas_base, atend_base, rent, sauda, cresc, mix, dermo) {
  const mensal = [1,2,3,4,5,6].map(mes => ({
    mes, 
    vendas: Math.round(vendas_base * (0.85 + Math.random()*0.3)),
    margem: Math.round(vendas_base * 0.22 * (0.85 + Math.random()*0.3)),
    atend:  Math.round(atend_base  * (0.85 + Math.random()*0.3)),
    ticket: Math.round((vendas_base / atend_base) * (0.9 + Math.random()*0.2) * 10) / 10,
    margem_atend: Math.round(vendas_base * 0.22 / atend_base * 10) / 10,
  }));
  const vendas_ytd = mensal.reduce((a,m) => a + m.vendas, 0);
  const margem_ytd = mensal.reduce((a,m) => a + m.margem, 0);
  const atend_ytd  = mensal.reduce((a,m) => a + m.atend,  0);
  const gen_mensal = {};
  [1,2,3,4,5,6].forEach(m => {
    gen_mensal[m] = { unidades: Math.round(atend_base * 0.4), rent_media: rent + (Math.random()-0.5)*0.3 };
  });
  return {
    cod: Math.floor(Math.random()*900)+100,
    nome,
    vendas_ytd,
    margem_ytd,
    atend_ytd,
    ticket_medio: Math.round(vendas_ytd/atend_ytd*10)/10,
    margem_atend: Math.round(margem_ytd/atend_ytd*10)/10,
    cresc_vs_ant: cresc,
    rent_genericos: rent,
    taxa_sauda: sauda,
    mensal,
    mix,
    genericos_mensal: Object.fromEntries(Object.entries(gen_mensal).map(([k,v]) => [k,v])),
    sauda_mensal: Object.fromEntries([1,2,3,4,5,6].map(m => [m, Math.round(atend_base*sauda/100)])),
    dermo: dermo || {},
  };
}

const DERMO_MOCK_FARM = {
  "Isdin":          { vendas: 8200,  margem: 4090,  margem_ant: 5200,  cresc: -21.3 },
  "Avène":          { vendas: 6100,  margem: 2950,  margem_ant: 3100,  cresc: -4.8  },
  "Bioderma":       { vendas: 5400,  margem: 2610,  margem_ant: 2400,  cresc: 8.8   },
  "Uriage":         { vendas: 4200,  margem: 2100,  margem_ant: 1900,  cresc: 10.5  },
  "Vichy":          { vendas: 3800,  margem: 1830,  margem_ant: 2100,  cresc: -12.9 },
  "Ducray":         { vendas: 3100,  margem: 1490,  margem_ant: 1200,  cresc: 24.2  },
  "SVR":            { vendas: 2900,  margem: 1400,  margem_ant: 1100,  cresc: 27.3  },
  "Eucerin":        { vendas: 2400,  margem: 1150,  margem_ant: 1300,  cresc: -11.5 },
  "Lierac":         { vendas: 2100,  margem: 1010,  margem_ant: 980,   cresc: 3.1   },
  "Nuxe":           { vendas: 1800,  margem: 870,   margem_ant: 920,   cresc: -5.4  },
  "Caudalie":       { vendas: 1500,  margem: 720,   margem_ant: 600,   cresc: 20.0  },
  "Klorane":        { vendas: 1200,  margem: 580,   margem_ant: 640,   cresc: -9.4  },
  "Phyto":          { vendas: 900,   margem: 430,   margem_ant: 380,   cresc: 13.2  },
  "Martiderm":      { vendas: 700,   margem: 340,   margem_ant: 280,   cresc: 21.4  },
  "Heliocare":      { vendas: 600,   margem: 290,   margem_ant: 310,   cresc: -6.5  },
  "Isdinceutics":   { vendas: 500,   margem: 240,   margem_ant: 180,   cresc: 33.3  },
  "Filorga":        { vendas: 400,   margem: 190,   margem_ant: 220,   cresc: -13.6 },
};

const MOCK_DATA = {
  gerado_em: new Date().toISOString(),
  ano: 2026,
  farmacias: {
    aroeira: {
      nome: "Aroeira",
      kpis: { margem_bruta: 291000, vendas_otc: 99000, vendas_saude: 268000, atendimentos: 2752 },
      sauda_programa: { valor_atribuido: 8579, rebat_pontos: 720, rebat_vales_sauda: 4988, rebat_vales_ind: 509, saldo_aprox: 2362, data_sync: "25/06/2026" },
      dermo: DERMO_MOCK_FARM,
      colaboradores: [

async function carregarDados() {

  try {

    document.getElementById('data-note').textContent =

// ── CALCULOS AUXILIARES ───────────────────────────────────────────────────────
function calcRentGlobal(colabs) {
  const vals = colabs.map(c => c.rent_genericos).filter(v => v !== null && v > 0);
  return vals.length > 0 ? vals.reduce((a,b) => a+b, 0) / vals.length : null;
}

function calcTaxaSaudaMedia(colabs) {
  const vals = colabs.map(c => c.taxa_sauda).filter(v => v !== null);
  if (!vals.length) return null;
  return Math.round(vals.reduce((a,b) => a+b, 0) / vals.length);
}

function calcMensalEquipa(colabs, mesFim) {
  const mapa = {};
  for (const c of colabs) {
    for (const m of (c.mensal || [])) {
      if (m.mes > mesFim) continue;
      if (!mapa[m.mes]) mapa[m.mes] = { mes: m.mes, vendas: 0, atend: 0 };
      mapa[m.mes].vendas += m.vendas || 0;
      mapa[m.mes].atend  += m.atend  || 0;
    }
  }
  return Object.values(mapa).sort((a,b) => a.mes - b.mes);
}

function calcMediaEquipa(colabs, campo) {
  const vals = colabs.map(c => c[campo]).filter(v => v !== null && v !== undefined);
  return vals.length > 0 ? vals.reduce((a,b) => a+b, 0) / vals.length : 0;
}

function selectColab(btn, nome) {
  document.querySelectorAll('.colab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  colabAtual = nome;
  renderColab(farmAtual, nome);
}

function renderColab(fkey, colabSlug) {
  const fd     = dados?.farmacias?.[fkey];
  const colabs = fd?.colaboradores || [];
  const colab  = colabs.find(c => slug(c.nome) === colabSlug);
  if (!colab) return;

  const idx    = colabs.indexOf(colab);
  const cor    = COLAB_COLORS[idx % COLAB_COLORS.length];
  const nome   = colab.nome.split(' ')[0];
  const mesFim = mesFimAtual;

  document.getElementById('colab-name-header').innerHTML =
    `${nome} <span style="font-size:13px;font-weight:400;color:var(--ink3)">· Jan–${MESES_LABELS[mesFim-1]} ${dados.ano}</span>`;

  // Calcular totais filtrados por mesFim
  const mensalFilt = (colab.mensal||[]).filter(m => m.mes <= mesFim);
  const vendas_ytd  = mensalFilt.reduce((a,m) => a+m.vendas, 0);
  const margem_ytd  = mensalFilt.reduce((a,m) => a+(m.margem||0), 0);
  const atend_ytd   = mensalFilt.reduce((a,m) => a+m.atend, 0);
  const ticket_ytd  = atend_ytd > 0 ? margem_ytd / atend_ytd : 0;  // usando margem/atend
  const margem_atend= atend_ytd > 0 ? margem_ytd / atend_ytd : 0;

  // Média equipa filtrada
  const mediaAtend    = colabs.reduce((a,c) => a + (c.mensal||[]).filter(m=>m.mes<=mesFim).reduce((s,m)=>s+m.atend,0), 0) / (colabs.length||1);
  const mediaMargemA  = colabs.reduce((a,c) => {
    const mf = (c.mensal||[]).filter(m=>m.mes<=mesFim);
    const mg = mf.reduce((s,m)=>s+(m.margem||0),0);
    const at = mf.reduce((s,m)=>s+m.atend,0);
    return a + (at>0 ? mg/at : 0);
  }, 0) / (colabs.length||1);
  const mediaTicket   = colabs.reduce((a,c) => a + (c.ticket_medio||0), 0) / (colabs.length||1);
  const mediaSauda    = calcTaxaSaudaMedia(colabs);

  const trendClass = (colab.cresc_vs_ant||0) >= 0 ? 'trend-up' : 'trend-dn';
  const trendSym   = (colab.cresc_vs_ant||0) >= 0 ? '▲' : '▼';

  document.getElementById('colab-stats').innerHTML = `
    <div class="stat-box">
      <div class="stat-label">Margem YTD</div>
      <div class="stat-val">${fmtE(Math.round(margem_ytd/1000))}k</div>
      <div class="stat-trend ${trendClass}">${trendSym} ${Math.abs(colab.cresc_vs_ant||0).toFixed(1)}% vs ${dados.ano-1}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Atendimentos YTD</div>
      <div class="stat-val">${fmt(atend_ytd)}</div>
      <div class="stat-trend">vs média: ${fmt(Math.round(mediaAtend))}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Margem/Atend.</div>
      <div class="stat-val">${fmtE(margem_atend,2)}</div>
      <div class="stat-trend">vs média: ${fmtE(mediaMargemA,2)}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Ticket Médio</div>
      <div class="stat-val">${fmtE(colab.ticket_medio||0,1)}</div>
      <div class="stat-trend">vs média equipa: ${fmtE(mediaTicket,1)}</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Taxa SAÚDA</div>
      <div class="stat-val">${colab.taxa_sauda !== null ? colab.taxa_sauda+'%' : '—'}</div>
      <div class="stat-trend">vs média: ${mediaSauda !== null ? mediaSauda+'%' : '—'}</div>
    </div>
  `;

  // Gráfico + mix
  const mensal = colab.mensal || [];
  const maxV   = Math.max(...mensal.map(m => m.vendas), 1);
  const chartHTML = `
    <div class="colab-card">
      <div class="colab-card-title">Vendas mensais (€k sem IVA)</div>
      <div class="bar-chart" style="height:100px">${mensal.map((m,i) => {
        const h = Math.max(Math.round((m.vendas / maxV) * 86), 4);
        const isLast = i === mensal.length - 1;
        return `<div class="bar-col">
          <div class="bar-val">${(m.vendas/1000).toFixed(1)}</div>
          <div class="bar-fill" style="height:${h}px;background:${isLast?cor:cor+'44'}"></div>
          <div class="bar-month" style="${isLast?'color:'+cor+';font-weight:600':''}">${MESES_LABELS[m.mes-1]}</div>
        </div>`;
      }).join('')}</div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between">
        <div style="font-size:11px;color:var(--ink3)">Acumulado YTD</div>
        <div style="font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace">${fmtE(colab.vendas_ytd||0)}</div>
      </div>
    </div>`;

  // Top 5 subcategorias — barras horizontais com vs média equipa
  const mix = colab.mix || {};
  const mixMedia = {};
  for (const c2 of colabs) {
    for (const [cat, pct] of Object.entries(c2.mix||{})) {
      mixMedia[cat] = (mixMedia[cat]||0) + pct;
    }
  }
  for (const cat in mixMedia) mixMedia[cat] = Math.round(mixMedia[cat] / colabs.length * 10) / 10;

  const mixEntries = Object.entries(mix).sort((a,b) => b[1]-a[1]);
  const maxPct = Math.max(...mixEntries.map(([,p]) => Math.max(p, mixMedia[mixEntries[0]?.[0]]||0)), 1);
  const mixHTML = `
    <div class="colab-card">
      <div class="colab-card-title">Subcategorias · % margem bruta vs média equipa</div>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
        ${mixEntries.map(([cat, pct]) => {
          const med = mixMedia[cat] || 0;
          const maxBar = Math.max(pct, med, 1);
          return `
          <div>
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <div style="font-size:11px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%">${cat}</div>
              <div style="font-size:11px;font-family:'JetBrains Mono',monospace">
                <span style="font-weight:600;color:${cor}">${pct}%</span>
                <span style="color:var(--ink4)"> / ${med}%</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:2px">
              <div style="background:var(--bg2);border-radius:2px;height:5px">
                <div style="background:${cor};height:5px;border-radius:2px;width:${Math.round((pct/maxBar)*100)}%"></div>
              </div>
              <div style="background:var(--bg2);border-radius:2px;height:5px">
                <div style="background:#d1d5db;height:5px;border-radius:2px;width:${Math.round((med/maxBar)*100)}%"></div>
              </div>
            </div>
          </div>`}).join('')}
        <div style="display:flex;gap:12px;margin-top:4px">
          <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:4px;border-radius:2px;background:${cor}"></div><div style="font-size:10px;color:var(--ink3)">Este colaborador</div></div>
          <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:4px;border-radius:2px;background:#d1d5db"></div><div style="font-size:10px;color:var(--ink3)">Média equipa</div></div>
        </div>
      </div>
    </div>`;

  document.getElementById('colab-grid-top').innerHTML = chartHTML + mixHTML;

  // Objetivos individuais
  const farmObjs = OBJ_INDIVIDUAL[fkey] || {};
  const nomeKey  = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const objList  = farmObjs[nomeKey] || [{ label:'Objetivo individual não configurado', pct:null, status:'amber', sub:'Definir em OBJ_INDIVIDUAL no código' }];
  const objColors = { green:'var(--green)', amber:'var(--amber)', red:'var(--red)' };
  const objLabels = { green:'✓ Atingido', amber:'Em curso', red:'Atenção' };

  const objHTML = `
    <div class="colab-card">
      <div class="colab-card-title">Objetivo individual 2026</div>
      <div class="obj-rows">${objList.map(o => `
        <div class="obj-row-item">
          <div class="obj-header">
            <div class="obj-name">${o.label}</div>
            <div class="obj-badge badge-${o.status}">${objLabels[o.status]}</div>
          </div>
          ${o.pct !== null ? `<div class="progress-track"><div class="progress-fill" style="width:${Math.min(o.pct,100)}%;background:${objColors[o.status]}"></div></div>` : ''}
          <div class="obj-sub">${o.sub}</div>
        </div>`).join('')}
      </div>
    </div>`;

  // Rentabilidade genéricos
  const rent      = colab.rent_genericos;
  const obj2026   = (OBJETIVOS[fkey]||OBJETIVOS.aroeira).rent_gen;
  const rentPct   = rent ? Math.min((rent/obj2026)*100,102) : 0;
  const rentOk    = rent >= obj2026;
  const genMensal = colab.genericos_mensal || {};
  const mesesGen  = Object.entries(genMensal).sort((a,b)=>+a[0]-+b[0]).slice(-6);
  const maxRent   = Math.max(...mesesGen.map(([,v]) => v.rent_media), obj2026, 1);

  const rentHTML = `
    <div class="colab-card">
      <div class="colab-card-title">Rentabilidade de Genéricos</div>
      <div style="display:flex;align-items:flex-end;gap:16px;margin-bottom:16px">
        <div>
          <div style="font-size:11px;color:var(--ink3);margin-bottom:4px">Valor YTD</div>
          <div style="font-size:36px;font-weight:700;font-family:'JetBrains Mono',monospace;color:${rentOk?'var(--green)':'var(--amber)'}">${rent?rent.toFixed(2)+'€':'—'}</div>
          <div style="font-size:11px;color:var(--ink3);margin-top:2px">/embalagem</div>
        </div>
        <div style="flex:1">
          <div style="font-size:11px;color:var(--ink3);margin-bottom:6px">vs objetivo ≥ ${obj2026.toFixed(2)}€</div>
          <div class="progress-track" style="height:8px">
            <div class="progress-fill" style="width:${rentPct}%;background:${rentOk?'var(--green)':'var(--amber)'}"></div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:4px">
            <div style="font-size:10px;color:${rentOk?'var(--green)':'var(--amber)'};font-weight:600">${rentOk?'✓ Objetivo atingido':'Em progresso'}</div>
            <div style="font-size:10px;color:var(--ink3);font-family:'JetBrains Mono',monospace">obj: ${obj2026.toFixed(2)}€</div>
          </div>
        </div>
      </div>
      ${mesesGen.length > 0 ? `
      <div style="margin-top:8px;padding-top:12px;border-top:1px solid var(--line)">
        <div style="font-size:10px;color:var(--ink3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.8px;font-weight:600">Histórico mensal</div>
        <div style="display:flex;gap:6px;align-items:flex-end;height:48px">
          ${mesesGen.map(([mes,v]) => {
            const h = Math.max(Math.round((v.rent_media/maxRent)*44), 4);
            const ok2 = v.rent_media >= obj2026;
            return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
              <div style="font-size:9px;font-family:'JetBrains Mono',monospace;color:${ok2?'var(--green)':'var(--amber)'}">${v.rent_media.toFixed(2)}</div>
              <div style="height:${h}px;width:100%;border-radius:3px 3px 0 0;background:${ok2?cor:cor+'88'}"></div>
              <div style="font-size:8px;color:var(--ink4)">${MESES_LABELS[+mes-1]?.charAt(0)||mes}</div>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;align-items:center;gap:6px;margin-top:8px">
          <div style="flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--green) 0,var(--green) 4px,transparent 4px,transparent 8px)"></div>
          <div style="font-size:10px;color:var(--green);font-family:'JetBrains Mono',monospace;white-space:nowrap">${obj2026.toFixed(2)}€ obj</div>
        </div>
      </div>` : ''}
    </div>`;

  // Dermo individual — acumulado até mesFim
  const dermoColab = colab.dermo || {};
  const dermoCEntries = Object.entries(dermoColab)
    .map(([marca, v]) => {
      const mensal = v.mensal || {};
      const margemAcum = Object.entries(mensal)
        .filter(([m]) => parseInt(m) <= mesFim)
        .reduce((a,[,mv]) => a + mv, 0);
      const margem = Object.keys(mensal).length > 0 ? margemAcum : (v.margem || 0);
      return [marca, { ...v, margem }];
    })
    .filter(([,v]) => v.margem > 0)
    .sort((a,b) => b[1].margem - a[1].margem);
  const maxDermoC = dermoCEntries.length > 0 ? dermoCEntries[0][1].margem : 1;

  // Calcular média da equipa por marca — acumulado até mesFim
  const dermoMediaEquipa = {};
  for (const c2 of colabs) {
    for (const [marca, v] of Object.entries(c2.dermo || {})) {
      const mensal = v.mensal || {};
      const margemAcum = Object.entries(mensal)
        .filter(([m]) => parseInt(m) <= mesFim)
        .reduce((a,[,mv]) => a + mv, 0);
      const margem = Object.keys(mensal).length > 0 ? margemAcum : (v.margem || 0);
      if (!dermoMediaEquipa[marca]) dermoMediaEquipa[marca] = { total: 0, count: 0 };
      dermoMediaEquipa[marca].total += margem;
      dermoMediaEquipa[marca].count += 1;
    }
  }

  const dermoCHTML = dermoCEntries.length > 0 ? `
    <div class="colab-card">
      <div class="colab-card-title">Dermocosmética · Margem YTD vs média equipa</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        ${dermoCEntries.map(([marca, v]) => {
          const med = dermoMediaEquipa[marca] ? Math.round(dermoMediaEquipa[marca].total / dermoMediaEquipa[marca].count) : 0;
          const ticket = v.ticket ? fmtE(v.ticket, 2) : '—';
          const maxBar = Math.max(v.margem, med, 1);
          return `<div>
            <div style="display:flex;justify-content:space-between;margin-bottom:3px">
              <div style="font-size:11px;color:var(--ink2);font-weight:500">${marca}</div>
              <div style="font-size:11px;font-family:'JetBrains Mono',monospace">
                <span style="font-weight:600;color:${cor}">${fmtE(v.margem,0)}</span>
                <span style="color:var(--ink4)"> / ${fmtE(med,0)}</span>
                <span style="color:var(--ink3);font-size:10px"> · ${ticket}</span>
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:2px">
              <div style="background:var(--bg2);border-radius:2px;height:5px">
                <div style="background:${cor};height:5px;border-radius:2px;width:${Math.round((v.margem/maxBar)*100)}%"></div>
              </div>
              <div style="background:var(--bg2);border-radius:2px;height:5px">
                <div style="background:#d1d5db;height:5px;border-radius:2px;width:${Math.round((med/maxBar)*100)}%"></div>
              </div>
            </div>
          </div>`;
        }).join('')}
        <div style="display:flex;gap:12px;margin-top:4px">
          <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:4px;border-radius:2px;background:${cor}"></div><div style="font-size:10px;color:var(--ink3)">Este colaborador</div></div>
          <div style="display:flex;align-items:center;gap:4px"><div style="width:10px;height:4px;border-radius:2px;background:#d1d5db"></div><div style="font-size:10px;color:var(--ink3)">Média equipa</div></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
          <div style="font-size:11px;color:var(--ink1);font-weight:700">Total</div>
          <div style="font-size:11px;font-family:'JetBrains Mono',monospace">
            <span style="font-weight:700;color:${cor}">${fmtE(dermoCEntries.reduce((a,[,v])=>a+v.margem,0),0)}</span>
            <span style="color:var(--ink4)"> / ${fmtE(Math.round(Object.values(dermoMediaEquipa).reduce((a,v)=>a+v.total/v.count,0)),0)}</span>
          </div>
        </div>
      </div>
    </div>` : '';

  document.getElementById('colab-grid-bot').innerHTML = objHTML + rentHTML + dermoCHTML;
}

// ── CONTROLOS ─────────────────────────────────────────────────────────────────
function setMesFim(mes, btn) {
  mesFimAtual = mes;
  if (dados) renderFarmacia(farmAtual);
}

function toggleMesSelector(btn) {
  const sel = document.getElementById('mes-selector');
  const visible = sel.style.display === 'flex';
  sel.style.display = visible ? 'none' : 'flex';
  btn.classList.toggle('active', !visible);
}

function setFarmacia(fkey, btn) {
  farmAtual = fkey;
  document.querySelectorAll('.farm-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (dados) renderFarmacia(fkey);
}

function setMode(mode, btn) {
  modoAtual = mode;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + mode).classList.add('active');
}

// ── INIT ──────────────────────────────────────────────────────────────────────
carregarDados();
</script>
</body>
</html>
