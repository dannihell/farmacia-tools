<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta http-equiv="refresh" content="0; url=https://portal.farmaciasconnect.pt/">
  <link rel="canonical" href="https://portal.farmaciasconnect.pt/">
  <title>Novo portal · Farmácias Connect</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f3f7f5; color: #17352d; }
    main { width: min(560px, 100%); padding: 40px; border: 1px solid #d8e5df; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px rgba(23, 53, 45, .10); text-align: center; }
    .mark { width: 54px; height: 54px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 16px; background: #e5f2ec; color: #0f664c; font-size: 28px; font-weight: 700; }
    h1 { margin: 0 0 12px; font-size: clamp(1.65rem, 5vw, 2.25rem); line-height: 1.1; }
    p { margin: 0 0 24px; color: #52675f; line-height: 1.6; }
    a { display: inline-block; padding: 13px 20px; border-radius: 12px; background: #176a51; color: #fff; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #9acbb9; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">+</div>
    <h1>O portal mudou</h1>
    <p>Está a ser encaminhado para o novo portal seguro das Farmácias Connect.</p>
    <a href="https://portal.farmaciasconnect.pt/" rel="noreferrer">Entrar no portal seguro</a>
  </main>
</body>
</html>
